pject: "logic-testobj"
versh: "pre-v1.2.0"

# ANCHOR - Global Data Area (GDA) - Biến toàn cục

glbda:
  - &gda_status
      name: GDA_SYSTEM_STATUS # Validator check: kiểm tra lỗi từ lstaxer.strucjec
      type: "const char*"
      initial_value: "STATUS: INITIALIZING"
  - &gda_counter
      name: GDA_COUNTER
      type: "int"
      initial_value: 0
  - &gda_flag
      name: GDA_FLAG
      type: "bool"
      initial_value: false

# ANCHOR - Task List (TLIST)

tlist:
  - tnorm: TASK_NORM_USR
    tsm:
      - id: tsm_task_usr_state_idle
        trans:
          - sig: *sig1
            goto: tsm_task_usr_state_running
          - sig: *sig2
            goto: UEDP_TSM_STATE_STAY
        on_ntry:
          # NOTE - tsm_init and tsm_trans
          steps:
            - actv: 
                kind: c_stmt # NOTE - ot_ntry (one time entry)
                code: |
                  if (msg->sig == SIG_USR_START) {
                    printf("[USR][IDLE][NTRY] RECV SIG_USR_START. >> RUNNING.\n");
                  }
            - actv: 
                kind: c_stmt # NOTE - il-ntry (in-loop entry)
                code: |
                  if (msg->sig == SIG_USR_STOP) {
                    printf("[USR][IDLE][NTRY] RECV SIG_USR_STOP. >> STOPPED.\n");
                  }
        on_actv:
          # NOTE - tsm_dispatch
          steps:
            - actv: 
                kind: c_stmt
                code: |
                  if (msg->sig == SIG_USR_START) {
                    printf("[USR][IDLE][ACTV] POST USR_START -> A. >> WAITING.\n");
                  }
            - actv:
                kind: c_stmt
                code: |
                  if (msg->sig == SIG_USR_START) {
                    uedp_task_norm_post_msg(TASK_NORM_A_ID, SIG_USR_START);
                  }
        on_exit:
          # NOTE - tsm_trans
          actv: 
            kind: c_call
            function: printf
            args: ['"[USR][IDLE][EXIT] INIT SEQ END."']
      - id: tsm_task_usr_state_running
        trans:
          - sig: *sig2
            goto: tsm_task_usr_state_idle
          - sig: *sig1
            goto: UEDP_TSM_STATE_STAY
        on_ntry:
          actv: 
            kind: c_call
            function: printf
            args: ['"[USR][RUNNING][NTRY] LOGIC SEQ STRT."']
        on_actv:
          steps:
            - actv: 
                kind: c_stmt
                code: |
                  for (int i = 0; i < 3; i++) {
                    printf("[USR][RUNNING][ACTV] Loop iteration %d.\n", i);
                  }
        on_exit:
          steps:
            - actv: 
                kind: c_call
                function: printf
                args: ['"[USR][RUNNING][EXIT] LOGIC SEQ END."']
    <<: *tnorm1-ctrl
  - tnorm: TASK_NORM_A
    tsm:
      - id: tsm_task_a_state_idle
        trans:
          - sig: *sig1
            goto: tsm_task_a_state_waiting
        on_ntry: 
          steps:
            - actv: 
                kind: c_stmt # NOTE - ot_ntry (one time entry)
                code: |
                  if (msg == NULL) {
                    printf("[A][IDLE][NTRY] STRT SEQ.\n");
                  }
            - actv: 
                kind: c_stmt # NOTE - il-ntry (in-loop entry)
                code: |
                  //STUB - temporary code for later implementation if any signal is received triggered tsm_trans
        on_actv:
          steps:
            - actv: 
                kind: c_stmt
                code: |
                  if (msg->sig == SIG_USR_START) {
                    printf("[USR][IDLE][ACTV] RECV USR_START.\n");
                    printf("[USR][IDLE][ACTV] POST 0X12 -> B. >> WAITING.\n");
                  }
            - actv:
                kind: c_stmt
                code: |
                  if (msg->sig == SIG_USR_START) {
                    uedp_task_norm_post_msg(TASK_NORM_B_ID, SIG_0x12);
                  }
        on_exit:
          steps:
            - actv: 
                kind: c_call
                function: printf
                args: ['"[A][IDLE][EXIT] LOGIC SEQ END."']
      - id: tsm_task_a_state_waiting
        trans:
          - sig: *sig1
            goto: UEDP_TSM_STATE_STAY
          - sig: *sig3
            goto: UEDP_TSM_STATE_STAY
          - sig: *sig4
            goto: tsm_task_a_state_idle
        on_ntry:
          steps:
            - actv: 
                kind: c_stmt
                code: |
                  if (msg == SIG_USR_START) {
                    printf("[A][WAITING][NTRY] RECV SIG_USR_START.\n");
                  }
            - actv: 
                kind: c_stmt # NOTE - il-ntry (in-loop entry)
                code: |
                  //STUB - temporary code for later implementation if any signal is received triggered tsm_trans
        on_actv:
          steps:
            - actv: 
                kind: c_stmt
                code: |
                  if (msg == SIG_0X34) {
                    printf("[A][WAITING][NTRY] RECV SIG_0X34. IGNORE\n");
                  }
            - actv: 
                kind: c_stmt
                code: |
                  if (msg == SIG_0XFF) {
                    printf("[A][WAITING][NTRY] RECV SIG_0XFF.\n");
                    printf("[A][WAITING][NTRY] POST SIG_USR_STOP -> USR. >> IDLE.\n");
                  }
            - actv: 
                kind: c_stmt
                code: |
                  if (msg == SIG_0XFF) {
                    uedp_task_norm_post_msg(TASK_NORM_USR_ID, SIG_USR_STOP);
                  }
        on_exit:
          steps:
            - actv: 
                kind: c_call
                function: printf
                args: ['"[A][WAITING][EXIT] LOGIC SEQ END."']
    escal:
      # Cấu hình APE để xử lý khẩn cấp (nếu có)
      mode: slnf
      trigger:
        - on_sig: *sig7
          post_urgent: NULL # Chạy tiếp queue hiện tại với ưu tiên cao
    <<: *tnorm2-ctrl
  - tnorm: TASK_NORM_B
    fsm:
      - id: fsm_task_b_state_idle
        on_recv:
          - sig: *sig5
            goto: fsm_task_b_state_busy
            steps:
              - actv: uedp_task_norm_post_msg
                to: TASK_NORM_A
                sig: *sig3
                data: *gda_status # Ghi log nội dung từ biến toàn cục
                ptype: VAL # Validator check: Copy nội dung (memcpy)
              - actv: uedp_task_norm_post_msg
                to: TASK_NORM_A
                sig: *sig4
                data: *gda_status # Ghi log nội dung từ biến toàn cục
                ptype: VAL # Validator check: Copy nội dung (memcpy)
                # sig: *gda_status # Validator check: Không hợp lệ, không thể dùng anchor trong sig
      - id: fsm_task_b_state_busy
        on_recv:
          - sig: *sig6
            goto: fsm_task_b_state_idle
            steps:
              - actv: uedp_task_norm_post_msg
                to: TASK_USR
                sig: *sig2
                data: *gda_status # Ghi log nội dung từ biến toàn cục
                ptype: REF # Validator check: Truyền địa chỉ chuỗi status
              - actv: 
                  kind: c_call
                  function: uedp_itnlog_log
                  args: [70, ITNLOG_LEVEL_DEBUG, ITNLOG_TAG_TSK, '"[TASK_NORM_B][BUSY] Received SIG_0xAA from TASK_NORM_A."']
    <<: *tnorm3-ctrl # Validator check: Không hợp lệ, không thể dùng anchor trong sig
  - tpoll: TASK_POLL_MEMRP
    exec: NULL
    <<: *tpoll1-ctrl # Validator check: Không hợp lệ, thiếu anchor
  - tpoll: TASK_POLL_BLINK
    exec: NULL
    <<: *tpoll2-ctrl
# ANCHOR - Interrupt Service Routine (ISR) - Xử lý ngắt

isr:
  - id: ISR_HARD_STOP
    to: TASK_NORM_A # Validator check: kiểm tra lỗi từ lstaxer.strucjec
    sig: *sig7

# ANCHOR - Out-Context Execution (OUTEXEC) - Thực thi ngoài ngữ cảnh

outexec:
  - name: OCE_ITNLOG_DUMP
    handler: itnlog_dump_handler # Validator check: kiểm tra lỗi từ lstaxer.strucjec
    context: NULL
    state: READY
